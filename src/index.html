<!DOCTYPE html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>JejakCerita - Bagikan Momen Indah Anda</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script type="module" src="/index.js"></script>
  </head>
  <body>
    <!-- Accessibility Skip to Main Content Link -->
    <a href="#main-content" class="skip-link">Lompati ke Konten Utama</a>

    <header>
      <div class="main-header container">
        <a class="brand-name" href="#/">JejakCerita</a>

        <nav id="navigation-drawer" class="navigation-drawer">
          <ul id="nav-list" class="nav-list">
            <li><a href="#/">Beranda</a></li>
            <li><a href="#/saved">Tersimpan</a></li>
            <li><a href="javascript:void(0)" id="logout-btn">Logout</a></li>
          </ul>
        </nav>

        <button id="drawer-button" class="drawer-button" aria-label="Buka Menu Navigasi" aria-expanded="false">☰</button>
      </div>
    </header>

    <!-- Global Offline Banner -->
    <div id="offline-banner" class="offline-banner" style="display: none;" role="alert" aria-live="assertive">
      <p>Anda sedang offline, menampilkan data yang tersimpan.</p>
    </div>

    <!-- Toast Notification Container for Accessibility -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <main id="main-content" class="main-content container"></main>
  </body>
</html>
